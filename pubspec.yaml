name: videoparse
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  webview_flutter: ^4.13.0
  webview_flutter_web: ^0.2.3+4
  gap: ^3.0.1
  logger: ^2.6.2
  http: ^1.6.0
  protobuf: ^6.0.0
  protoc_plugin: ^25.0.0
  go_router: ^17.0.1
  youtube_explode_dart: ^3.0.5
  url_strategy: ^0.3.0
  pointer_interceptor: ^0.10.1+2
  shared_preferences: ^2.5.4
  google_fonts: ^6.3.3
  web: ^1.1.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
